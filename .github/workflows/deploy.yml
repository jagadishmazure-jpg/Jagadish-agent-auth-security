# GATED OFF: jobs run only when DEPLOY_ENABLED == 'true'. Not set, so nothing deploys.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      azure_tool:
        type: choice
        options: [terraform, bicep]
        default: terraform
      promote_to_prod:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
env:
  TF_VERSION: "1.16.4"
  AZURE_TOOL: ${{ inputs.azure_tool || vars.AZURE_TOOL || 'terraform' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Report deploy gate
        env:
          ENABLED: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          {
            echo "### Deploy gate"
            echo "- DEPLOY_ENABLED: \`${ENABLED}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$ENABLED" == "true" ]] || echo "::notice::Deployment disabled; deploy jobs are skipped."

  deploy-dev:
    needs: preflight
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: dev
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_AZURE_RESOURCE_GROUP: ${{ vars.TFSTATE_AZURE_RESOURCE_GROUP }}
      TFSTATE_AZURE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_AZURE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: .github/scripts/deploy.sh provision
      - run: .github/scripts/deploy.sh smoke

  deploy-prod:
    needs: [preflight, deploy-dev]
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.promote_to_prod)
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: prod
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_AZURE_RESOURCE_GROUP: ${{ vars.TFSTATE_AZURE_RESOURCE_GROUP }}
      TFSTATE_AZURE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_AZURE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: .github/scripts/deploy.sh provision
      - run: .github/scripts/deploy.sh smoke
