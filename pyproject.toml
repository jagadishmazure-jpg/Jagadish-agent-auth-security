[project]
name = "agent-auth-security"
version = "0.1.0"
description = "End-to-end authentication and authorization for users and AI agents: JWT vs sessions measured side by side, hardened tokens (DPoP, refresh rotation, JWKS), OAuth 2.1 / OIDC, on-behalf-of delegation, MCP and A2A auth, and Azure Entra / APIM / Key Vault mapping. Offline-first portfolio for a fictional company."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "joserfc==1.7.7",
  "fakeredis==2.40.0",
  "pyyaml==6.0.3",
  "pydantic>=2.13,<3",
  "agent-framework-core==1.23.0",
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]
entra = ["msal>=1.31,<2", "azure-identity>=1.25,<2"]

[project.scripts]
aauth = "aauth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aauth"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
